# Manual Linux CI for xwpe -- the GUI test gates that need a real display.
#
# Codeberg/Forgejo has no Linux GUI runners wired up, so this runs on the GitHub
# push-mirror (github.com/vejeta/xwpe).  It is "workflow_dispatch" ONLY -- it
# never runs on push; launch it on demand from the Actions tab or with:
#     gh workflow run linux.yml --repo vejeta/xwpe
#
# What it guards, on top of the C `make check`:
#   - the build with the native Wayland backend (--with-wayland);
#   - the ncurses UI under a pseudo-terminal (pyte);
#   - the X11/Xft GUI under Xvfb + matchbox (tests/x11);
#   - the NATIVE WAYLAND GUI under Xvfb + weston (tests/wayland) -- the editor on
#     a real wl_surface, driven via wl_keyboard/wl_pointer, incl. the wl_data_device
#     clipboard interop (wl-clipboard).
# All three front-ends share one SCREENCELL/editor core, so running the same
# operations under each catches a divergence in any single backend.

name: Linux (manual)

on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build + GUI test gates
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
      # The runner exports XDG_CONFIG_HOME.  The editor reads it before HOME,
      # so every test session would share one xwperc, one key file and one
      # session store across workers and reruns, and fail on what an earlier
      # test saved (the 81 runner-only failures of 2026-10-20).  Empty means
      # "unset" to the editor: each session falls back under its own HOME.
      XDG_CONFIG_HOME: ""
      XDG_STATE_HOME: ""
      # CI runners are slower and more loaded than a dev box; stretch every
      # harness settle (keystroke -> screenshot) so timing flakes don't masquerade
      # as failures -- same knob the Debian autopkgtest uses.
      XWPE_TEST_WAIT_SCALE: "3"
    steps:
      - uses: actions/checkout@v5

      - name: Install build + GUI-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake autopoint pkg-config \
            libncursesw5-dev ncurses-term libx11-dev libxext-dev libxft-dev \
            libfontconfig1-dev libcairo2-dev libpango1.0-dev libfreetype-dev \
            libvterm-dev libjson-c-dev zlib1g-dev libgpm-dev libssl-dev \
            libwayland-dev wayland-protocols libwayland-bin libxkbcommon-dev \
            xvfb x11-utils x11-xserver-utils xauth xdotool \
            matchbox-window-manager imagemagick weston wl-clipboard \
            python3 python3-pip python3-venv python3-pil

      - name: Build (--with-wayland --enable-ai)
        # The assistant is off by default at configure time, so a build without
        # --enable-ai leaves its sources out and every assistant test either
        # skips or, where a file's build guard is incomplete, fails for the
        # build's reason.  The capability gates below are about the assistant,
        # so this job builds it; the agent host goes in too, because some
        # scenarios drive the host engine.
        run: |
          autoreconf -fi
          ./configure --with-wayland --enable-ai --enable-ai-agent-host
          make -j"$(nproc)"
          # Confirm what was actually compiled in, rather than trusting flags.
          grep -q '#define HAVE_WAYLAND 1' config.h
          grep -q '#define WPE_AI 1' config.h
          grep -q '#define WPE_AI_AGENT_HOST 1' config.h
          ldd ./we | grep -Eiq 'wayland-client|xkbcommon'

      - name: make check (C unit tests)
        # The deterministic, server-free unit tests (the LSP/DAP server-driven
        # ones are toolchain-bound; covered separately where the servers exist).
        # The two assistant programs are here because libssl-dev is installed
        # above: they link the HTTP layer, which only this job builds with TLS,
        # and that link broke once without any build noticing.
        run: >-
          make check
          TESTS="test_checkheader test_syntax_def test_fdloop test_clipboard
          test_lsp_buffer test_lsp_doctor test_lsp_semantic test_lsp_truecolor
          test_dap test_ai_http test_ai_diff"

      - name: Set up a pytest venv + a private XDG_RUNTIME_DIR
        run: |
          python3 -m venv /tmp/ptenv
          /tmp/ptenv/bin/pip install --quiet pyte==0.8.1 pytest pytest-rerunfailures pytest-xdist pillow
          mkdir -p /tmp/xdg && chmod 700 /tmp/xdg

      - name: ncurses UI suite (pyte, pseudo-terminal)
        # The deterministic key / menu / editing / rendering scenarios; the
        # toolchain-bound LSP/DAP/compile pipelines are excluded to stay fast.
        #
        # NON-BLOCKING by itself: the capability gate below reads this step's
        # junit, so the scenarios that matter fail the job from there.
        #
        # The tests run once, in four workers.  A test spends nearly all its
        # time waiting for the editor to paint, so workers overlap almost
        # perfectly; one run of 2026-10-19 took three hours serially and the
        # gate then ran the mapped tests a second time, which hit the
        # six-hour job limit.  The junit written here is what the gate reads.
        # --reruns gives a timing wobble under load two more tries; a real
        # fault fails all three.
        #
        # XWPE_TEST_SETTLE_MS: a key's wait ends once the editor has painted
        # and stayed silent this long, instead of sleeping the whole delay.
        # Locally at 250 ms it cut the suite's test time by a third with no
        # failure and no rerun; the runner is slower, so it gets a wider window.
        continue-on-error: true
        env:
          TERM: "xterm-256color"
          XWPE_TEST_SETTLE_MS: "400"
        run: |
          export XWPE_LIB="$PWD"
          WPE_BIN="$PWD/wpe" /tmp/ptenv/bin/python -m pytest -q tests \
            --ignore=tests/x11 --ignore=tests/wayland --durations=40 \
            -n 4 --reruns 2 --reruns-delay 3 -rf \
            --junitxml="$PWD/suite-junit.xml" \
            -k "not (_live or clangd or gopls or rust or scala or metals or python_lsp or go_dap or dap or algol68 or ga68 or truecolor_console or compile or make_output or build_cwd or user_screen or debugger_watchdog or ctrl_f9 or alt_f5)"

      - name: Capability drift guard (BLOCKING)
        # Cheap, deterministic and nothing to do with a terminal: every manifest
        # id must resolve to a test that collects, and every tests/**/test_ai_*.py
        # must be mapped or listed in tests/harness/UNMAPPED.txt.  This is what
        # catches a test renamed or deleted out from under a scenario, which is
        # how a capability quietly stops being covered while its harness still
        # reports green.  Run with the suite's own interpreter: under a bare
        # python3 with no pyte nothing collects and every row reads as drift.
        if: always()
        run: /tmp/ptenv/bin/python tests/harness/harness.py check

      - name: Capability harness gates (BLOCKING)
        # Every capability with a manifest gates, found by listing the
        # manifests, so a new capability cannot be left out of the loop.  The
        # verdicts are read from the suite's junit above: the gate runs only
        # the mapped tests the suite did not select (its -k leaves out a few),
        # in a second, small junit, and never runs a test twice.  If the suite
        # died before writing its junit, every mapped test runs here.  Every
        # capability is judged even when an earlier one failed, and the step
        # fails at the end naming each that did.  A scenario that is FAIL or
        # MISSING fails it.
        if: always()
        env:
          TERM: "xterm-256color"
          XWPE_TEST_SETTLE_MS: "400"
          XWPE_UI_TRACE: ${{ github.workspace }}/harness-ui-trace.log
        run: |
          export XWPE_LIB="$PWD"
          PY=/tmp/ptenv/bin/python
          mkdir -p tests/harness/out
          failed=""
          for manifest in tests/harness/*/manifest.json; do
            cap=$(basename "$(dirname "$manifest")")
            echo "::group::harness $cap (ncurses)"
            sources="$PWD/suite-junit.xml"
            missing=$("$PY" tests/harness/harness.py missing "$cap" ncurses "$sources")
            if [ -n "$missing" ]; then
              topup="$PWD/tests/harness/out/$cap-topup.xml"
              WPE_BIN="$PWD/wpe" "$PY" -m pytest -q $missing \
                --reruns 2 --reruns-delay 3 -rf --junitxml="$topup" || true
              sources="$sources,$topup"
            fi
            "$PY" tests/harness/harness.py report "$cap" ncurses "$sources" \
              > "tests/harness/out/$cap-ncurses.json" || failed="$failed $cap"
            cat "tests/harness/out/$cap-ncurses.json"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "harness gate failed for:$failed"
            exit 1
          fi

      - name: X11/Xft GUI suite (Xvfb + matchbox)
        # The conftest starts its own Xvfb + window manager; it skips cleanly if
        # a tool is missing.  always(): run even if the ncurses gate above failed,
        # so a flake in one backend never hides another's result.
        if: always()
        env:
          XDG_RUNTIME_DIR: /tmp/xdg
        run: XWPE_BIN="$PWD/xwpe" /tmp/ptenv/bin/python -m pytest -q tests/x11

      - name: Native Wayland resize/relayout gate (BLOCKING)
        # The one cross-cutting concern that has silently regressed before (the
        # Messages-window relayout on shrink went unnoticed for weeks).  Gate the
        # job HARD on the deterministic resize/relayout parity tests only: few
        # enough to run reliably even on a slow shared runner, and wrapped in
        # --reruns so a pure timing wobble retries and self-heals while a real
        # code fault -- which fails every rerun -- fails the job.  This is the
        # genuine red/green guard for the Wayland backend; the full suite below
        # stays visible for breadth but does not gate (it is too large to run
        # flake-free as a hard gate on this runner).
        if: always()
        env:
          XDG_RUNTIME_DIR: /tmp/xdg
          XWPE_WL_LOGDIR: ${{ github.workspace }}/wl-logs
        run: >-
          XWPE_BIN="$PWD/xwpe" /tmp/ptenv/bin/python -m pytest -q
          tests/wayland/test_resize.py tests/wayland/test_resize_mouse.py
          --reruns 3 --reruns-delay 5 -rxX

      - name: Native Wayland GUI suite -- full breadth (Xvfb + weston)
        # The conftest starts its own Xvfb + weston (x11-backend, kiosk-shell) and
        # skips cleanly if weston / wl-clipboard / Pillow is missing.  This is the
        # native wl_surface backend: real wl_keyboard/wl_pointer + wl_data_device.
        # always(): run even if an earlier gate failed, so the Wayland result is
        # always visible.
        #
        # NON-BLOCKING on this runner: the full suite drives a real-compositor GUI
        # stack -- Xvfb + weston (GL via the X11 backend) + xwpe + xdotool, per
        # test -- which the shared GitHub free runner has become too slow per-test
        # to run flake-free as a hard gate (the job went 17 -> 31 min over a week
        # as the runner degraded; the Wayland step alone takes ~3x its local
        # wall-time).  Its failures are pure timing, NOT code faults: the captured
        # per-test xwpe stderr is a clean exit in every case, and the suite passes
        # locally (49 passed, 2 skipped) and on a real Wayland desktop.  The
        # resize/relayout concern above is the hard gate; this stays visible for
        # breadth and uploads logs.
        continue-on-error: true
        if: always()
        env:
          XDG_RUNTIME_DIR: /tmp/xdg
          # Capture weston + per-test xwpe stderr so a failure on a loaded runner
          # is explainable (a real crash vs a slow-runner mistime).
          XWPE_WL_LOGDIR: ${{ github.workspace }}/wl-logs
        run: XWPE_BIN="$PWD/xwpe" /tmp/ptenv/bin/python -m pytest -q tests/wayland -rxX

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-logs
          path: |
            *.log
            suite-junit.xml
            harness-ui-trace.log
            wl-logs/
            tests/harness/out/
          if-no-files-found: ignore
