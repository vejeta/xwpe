# Manual Linux CI for xwpe -- the GUI test gates that need a real display.
#
# Codeberg/Forgejo has no Linux GUI runners wired up, so this runs on the GitHub
# push-mirror (github.com/vejeta/xwpe).  It is "workflow_dispatch" ONLY -- it
# never runs on push; launch it on demand from the Actions tab or with:
#     gh workflow run linux.yml --repo vejeta/xwpe
#
# What it guards, on top of the C `make check`:
#   - the build with the native Wayland backend (--with-wayland);
#   - the ncurses UI under a pseudo-terminal (pyte);
#   - the X11/Xft GUI under Xvfb + matchbox (tests/x11);
#   - the NATIVE WAYLAND GUI under Xvfb + weston (tests/wayland) -- the editor on
#     a real wl_surface, driven via wl_keyboard/wl_pointer, incl. the wl_data_device
#     clipboard interop (wl-clipboard).
# All three front-ends share one SCREENCELL/editor core, so running the same
# operations under each catches a divergence in any single backend.
#
# One run, several jobs (one run at a time stays true):
#   build    builds the program once, runs `make check` and the C units under
#            the sanitizers, collects the rows of every layer, plans which rows
#            run in which job from the recorded time of each row
#            (tests/harness/suite_plan.py) and fails the run in minutes when a
#            layer no longer fits;
#   suite    one job per shard of the plan, of whichever layer that shard holds
#            (ncurses, X11 or native Wayland): a shard runs its node ids under
#            the display its own conftest starts, and is cut by
#            tests/harness/job_cut.py after its own layer's minutes, inside its
#            step's limit, inside its job's, so GitHub's six-hour limit never
#            ends a job and a cut keeps its junit, its status and its trace;
#   gate     reads every shard's junit and status, judges every capability of
#            every layer, prints the plan's verdict of every row that failed or
#            never ran, and records the time of each row for the next plan;
#   x11-core builds the program without Xft and Cairo and runs the resize and
#            uncover rows on it, a program the default build never makes.
#
# Versions: the runner, the actions, pyte and pytest are named in
# tests/ci-versions.txt and checked by tests/check-ci-versions.sh.  ubuntu-26.04
# is the newest image (GitHub calls it a public preview; ubuntu-latest is still
# 24.04).  The first run on a new image compares its passed and skipped counts
# with the last run on the old one: a rise in skips is a finding, not a green.

name: Linux (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  # The runner exports XDG_CONFIG_HOME.  The editor reads it before HOME,
  # so every test session would share one xwperc, one key file and one
  # session store across workers and reruns, and fail on what an earlier
  # test saved (the 81 runner-only failures of 2026-10-20).  Empty means
  # "unset" to the editor: each session falls back under its own HOME.
  XDG_CONFIG_HOME: ""
  XDG_STATE_HOME: ""
  # CI runners are slower and more loaded than a dev box; stretch every
  # harness settle (keystroke -> screenshot) so timing flakes don't masquerade
  # as failures -- same knob the Debian autopkgtest uses.
  XWPE_TEST_WAIT_SCALE: "3"
  # The host tools every job but x11-core installs (tests/ci-install.sh;
  # tests/ci-tools.txt keeps the list equal to it by tests/check-ci-tools.sh).
  # A row that declares one of them and skips is a failure of the image, not a
  # declared absence, and a display layer whose tool is missing stops the
  # session.
  XWPE_TEST_TOOLS_EXPECTED: >-
    gdb dlv scalac scala ga68 a68g de_DE.UTF-8
    Xvfb xdotool xwd xlogo xwininfo weston matchbox-window-manager
    magick xwdtopnm wl-clipboard wl-copy wl-paste

jobs:
  build:
    name: Build, plan and check
    runs-on: ubuntu-26.04
    # Above the sum of its steps: the two sanitizer steps are cut at 30
    # minutes each on their own, and the job has to outlive every step's cut
    # so a step that was cut still reports what it got.
    timeout-minutes: 105
    # The newest timing record is looked up in the artifacts of earlier runs
    # (actions: read); naming a scope turns every other one off, so checkout
    # needs contents: read named.
    permissions:
      contents: read
      actions: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Which cut program this image ships
        # Evidence only: every cut of this workflow goes through
        # tests/harness/job_cut.py, which does not depend on it.  The runner's
        # own cut program once ended its grace at once, so an interrupted run
        # never got the seconds it needs to write its junit; this line names
        # the program, its package and the signal dispositions of a step.
        run: |
          TIMEOUT_PATH=$(command -v timeout || true)
          echo "cut program of this image: ${TIMEOUT_PATH:-none}"
          if [ -n "$TIMEOUT_PATH" ]; then
            readlink -f "$TIMEOUT_PATH"
            "$TIMEOUT_PATH" --version 2>&1 | head -n 2
          fi
          grep -E '^(SigBlk|SigIgn|SigCgt)' /proc/self/status

      - name: Install build, tool and GUI-test dependencies
        run: sh tests/ci-install.sh

      - name: Build (--with-wayland --enable-ai)
        # The assistant is off by default at configure time, so a build without
        # --enable-ai leaves its sources out and every assistant test either
        # skips or, where a file's build guard is incomplete, fails for the
        # build's reason.  The capability gates below are about the assistant,
        # so this job builds it; the agent host goes in too, because some
        # scenarios drive the host engine.
        run: |
          autoreconf -fi
          ./configure --with-wayland --enable-ai --enable-ai-agent-host
          make -j"$(nproc)"
          # Confirm what was actually compiled in, rather than trusting flags.
          grep -q '#define HAVE_WAYLAND 1' config.h
          grep -q '#define WPE_AI 1' config.h
          grep -q '#define WPE_AI_AGENT_HOST 1' config.h
          ldd ./we | grep -Eiq 'wayland-client|xkbcommon'
          # What the binary says it contains: the line every test reads.
          ./we --version

      - name: make check (C unit tests)
        # The deterministic, server-free unit tests (the LSP/DAP server-driven
        # ones are toolchain-bound; covered separately where the servers exist).
        # The two assistant programs are here because libssl-dev is installed
        # above: they link the HTTP layer, which only this job builds with TLS,
        # and that link broke once without any build noticing.
        # WPE_EXPECT_BUILT is what this job configured: a library missing from
        # the image fails tests/check-build-config.sh here instead of turning
        # a capability into "not built here" and a green run.
        env:
          WPE_EXPECT_BUILT: >-
            enable-ai=yes enable-ai-agent-host=yes enable-ai-tls=yes
            with-wayland=yes
        run: >-
          make check
          TESTS="tests/check-build-config.sh test_checkheader test_syntax_def test_fdloop test_clipboard
          test_lsp_buffer test_lsp_doctor test_lsp_semantic test_lsp_truecolor
          test_dap test_ai_http test_ai_diff test_fmt test_numtext
          test_brkmatch test_rowread
          tests/check-fmt-writes.sh tests/check-brk-bounds.sh"

      - name: C units under the sanitizers (AddressSanitizer + UBSan)
        # The owner of a formatted text and its callers (the request header
        # of the assistant's HTTP client included) run with the sanitizers, so
        # a byte written past a size is a report here and not only a guard
        # byte that changed.  The same step takes any further unit that reads
        # or writes rows of the text.
        #
        # Cut like every other long step of this workflow: by
        # tests/harness/job_cut.py (25 min) inside the step (30 min) inside
        # the job, so a row that hangs under the sanitizers ends the step and
        # the job still reports what it got, instead of running to GitHub's
        # own limit.  The interrupt, not a kill, is what lets pytest write
        # what it finished.
        timeout-minutes: 30
        run: |
          tests/run-tests.sh --asan-units
          # The rows that drive the editor's own formatted texts, run on
          # the sanitizer build under the name wpe-asan.  The pytest venv
          # of the next step does not exist yet, so this step makes its own.
          tests/run-tests.sh --asan-build
          python3 -m venv /tmp/asanenv
          /tmp/asanenv/bin/pip install --quiet pyte==0.8.2 pytest pillow
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          export XWPE_TEST_WAIT_SCALE=2
          export WPE_BIN="$PWD/wpe-asan"
          python3 tests/harness/job_cut.py --after 25m --grace 120 -- \
            /tmp/asanenv/bin/python -m pytest -q \
            tests/test_fmt_sites.py tests/test_ai_formatted_requests.py \
            tests/test_debugger_command_length.py

      - name: Set up the pytest venv
        run: sh tests/ci-venv.sh

      - name: Reads outside a row (AddressSanitizer)
        # A walk that reads the byte before a row or past its NUL is no failure
        # of a plain build: the byte belongs to the allocator, and the answer
        # changes only with what it left there.  Only a sanitizer sees it, so
        # the unit of the readers and the rows of the walks (Run > Beautify, the
        # syntax colours, the painters of a help page) run under one.  The
        # editor is started as wpe-asan: under the name we the programming
        # layer is off and the rows would test nothing.  Cut like the step
        # above: job_cut.py inside the step inside the job.
        timeout-minutes: 30
        env:
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:allow_user_segv_handler=0"
        run: |
          cc -std=gnu17 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -include config.h -I. tests/test_rowread.c -o /tmp/test_rowread-asan
          /tmp/test_rowread-asan
          tests/run-tests.sh --asan-build
          export XWPE_LIB="$PWD"
          WPE_BIN="$PWD/wpe-asan" XWPE_TEST_WAIT_SCALE=2 \
            python3 tests/harness/job_cut.py --after 25m --grace 120 -- \
            /tmp/ptenv/bin/python -m pytest -q \
            tests/test_row_readers.py tests/test_help_paint.py \
            tests/test_help_check.py tests/test_error_search_text.py -n 4

      - name: Collect the rows and plan the jobs
        # Every layer's rows are collected once: the ncurses selection, plus
        # every ncurses row a manifest maps, plus every row of tests/x11 and of
        # tests/wayland.  The plan gives each row to a shard of its own layer,
        # from the recorded time of the rows: the newest record of this branch
        # that has not expired, merged by layer into the tracked one, so a
        # record that measured one layer never says anything about another.
        # `fit` fails the run here, in minutes, when a layer no longer fits in
        # the shards it may have.  The shards get node ids and no selection, so
        # a row the selection leaves out and a manifest maps still runs.
        # `shards` prints the matrix the suite job takes whole: one object a
        # shard, with its index, its layer and the limits of its step and job.
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLAN="/tmp/ptenv/bin/python tests/harness/suite_plan.py"
          mkdir -p plan
          $PLAN collect plan/ids.txt
          cp tests/harness/suite-timings.json plan/record.json
          $PLAN fetch --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" \
            --out plan/fetched.json --settle-ms 400
          if [ -s plan/fetched.json ]; then cp plan/fetched.json plan/record.json; fi
          $PLAN plan plan/plan.json --record plan/record.json \
            --collected plan/ids.txt --scale "$XWPE_TEST_WAIT_SCALE"
          $PLAN fit --record plan/record.json --collected plan/ids.txt
          echo "shards=$($PLAN shards plan/plan.json)" >> "$GITHUB_OUTPUT"

      - name: Capability drift guard (BLOCKING)
        # Cheap, deterministic and nothing to do with a terminal: every manifest
        # id must resolve to a test that collects, every tests/**/test_ai_*.py
        # must be mapped or listed in tests/harness/UNMAPPED.txt, and the suite
        # must still fit in the jobs of the plan.  This is what catches a test
        # renamed or deleted out from under a scenario, which is how a capability
        # quietly stops being covered while its harness still reports green.
        # It runs here, in the job that built the tree: some files read the
        # binary or its tools while they collect, so on an unbuilt checkout
        # rows would fail to collect and read as drift.  Run with the suite's
        # own interpreter: under a bare python3 with no pyte nothing collects.
        run: /tmp/ptenv/bin/python tests/harness/harness.py check

      - name: Pack the built tree
        # The tests need only the tree (XWPE_LIB is the checkout), unpacked at
        # the same path in every job.
        run: tar --exclude=.git --exclude=./plan -czf /tmp/tree.tar.gz .

      - name: Upload the built tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree
          path: /tmp/tree.tar.gz
          retention-days: 3

      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-plan
          path: plan/
          retention-days: 3

  suite:
    name: ${{ matrix.layer }} suite, shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-26.04
    # The plan's own numbers: the shard is cut by tests/harness/job_cut.py
    # after its layer's minutes, the step's limit sits above that cut and its
    # grace, and the job's above the step's, so GitHub's own limit never ends a
    # job and the upload steps still run after a cut.  They come from the
    # matrix the build job planned (tests/harness/suite_plan.py) and never from
    # this file: a layer's budget is the planner's business, and it refuses a
    # plan whose minutes do not rise in that order.
    timeout-minutes: ${{ matrix.job_min }}
    # One job a shard, of whichever layer that shard holds.  The build job's
    # plan prints one object a shard, with its index, its layer and its limits,
    # and `include` takes those objects whole, so ${{ matrix.shard }} is the
    # index the shard script reads its rows from and ${{ matrix.layer }} names
    # the suite in the job's own name.  A shard that fails does not stop the
    # others: the gate judges every row of every layer from what they uploaded.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.shards) }}
    env:
      TERM: "xterm-256color"
      # A key's wait ends once the editor has painted and stayed silent this
      # long, instead of sleeping the whole delay.  Locally at 250 ms it cut the
      # suite's test time by a third with no failure and no rerun; the runner
      # is slower, so it gets a wider window.  Every layer gets it: a display
      # row never reads it, and a variable nothing reads changes nothing.
      XWPE_TEST_SETTLE_MS: "400"
      # The record the plan was made from: the row clock reads it too.
      XWPE_SUITE_TIMINGS: ${{ github.workspace }}/plan/record.json
    steps:
      - name: Download the built tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree
          path: /tmp/tree

      - name: Unpack the tree
        run: tar -xzf /tmp/tree/tree.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: suite-plan
          path: plan

      - name: Install build, tool and GUI-test dependencies
        # Every layer installs the one list: a display shard needs the X
        # server, the window manager and the compositor, a ncurses one the
        # debuggers and the language servers its rows drive.  A row that
        # declares one of them and skips is a failure of the image, not a
        # declared absence.
        run: sh tests/ci-install.sh

      - name: Set up the pytest venv
        run: sh tests/ci-venv.sh

      - name: Run the shard
        # NON-BLOCKING by itself: the gate reads this shard's junit and status
        # file, so a row that failed or never ran fails the run from there.
        # The script knows nothing about layers: it runs the node ids and the
        # pytest options of plan/args-K.txt, cut by tests/harness/job_cut.py
        # after the shard's own minutes, inside the step's limit, inside the
        # job's.  A display shard's own conftest starts the Xvfb and the window
        # manager, or the weston, that its rows need, in the private runtime
        # folder the script makes for it, and keeps its log tree where the
        # script copies it out for the upload below.  Each row runs under its
        # own clock, and `--rerun-except RowOverBudget` keeps a cut row from
        # running again.
        continue-on-error: true
        timeout-minutes: ${{ matrix.step_min }}
        run: sh tests/ci-shard.sh ${{ matrix.shard }}

      - name: Upload the shard's junit, status and trace
        # The gate downloads every one of these and nothing else: a display
        # shard's log tree goes as its own artifact below, so no screenshot is
        # merged into the folder the gate reads its junit files from.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-junit-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: ignore
          # An editor that crashes writes its crash file to its state folder,
          # which a row's HOME puts under ".local/state/xwpe" (we_unix.c
          # wpe_crash_path_init).  Hidden files are excluded by default, so
          # without this the one file a SIGSEGV row leaves would stay behind.
          include-hidden-files: true

      - name: Upload the shard's log tree
        # A display shard's log tree: every process's log, the session's Xvfb or
        # weston log, the screenshots and the crash files, copied out of the
        # temporary folder by the shard script, which leaves a link loop a row
        # planted behind (an upload that stats every entry it walks ends with
        # ELOOP, holding nothing at all).  A ncurses shard keeps no tree and
        # uploads nothing.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-logs-${{ matrix.shard }}
          path: shard-logs/
          if-no-files-found: ignore
          include-hidden-files: true

  gate:
    name: Capability gates
    needs: [build, suite]
    # Runs when a job before it failed or was cut: a missing shard is the
    # finding, and every capability is judged whatever happened.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TERM: "xterm-256color"
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the pytest venv
        run: sh tests/ci-venv.sh

      - name: Download the plan
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: suite-plan
          path: plan

      - name: Download every shard's junit and status
        # A shard that uploaded nothing is named by the report below, not here.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suite-junit-*
          merge-multiple: true
          path: shards

      - name: Capability harness gates (BLOCKING)
        # Every capability with a manifest gates, found by listing the
        # manifests, so a new capability cannot be left out of the loop, and
        # every layer of the plan is judged for it, so a scenario mapped in
        # tests/x11 or tests/wayland is read as well as a ncurses one.  The
        # verdicts are read from every shard's junit together with the plan and
        # the shards' status files: a mapped row that no junit holds is MISSING
        # and the line says whether its shard was cut, ended early or uploaded
        # nothing.  Nothing runs again here.  Every capability of every layer is
        # judged even when an earlier one failed, and the step fails at the end
        # naming each that did.  A scenario that is FAIL or MISSING fails it,
        # unless the plan only shows its row, which the report prints as SHOWN.
        if: always()
        run: |
          PY=/tmp/ptenv/bin/python
          mkdir -p tests/harness/out
          sources=$(ls shards/suite-junit-*.xml 2>/dev/null | paste -sd, -)
          failed=""
          for manifest in tests/harness/*/manifest.json; do
            cap=$(basename "$(dirname "$manifest")")
            for layer in ncurses x11 wayland; do
              echo "::group::harness $cap ($layer)"
              "$PY" tests/harness/harness.py report "$cap" "$layer" "$sources" \
                --plan plan/plan.json --status shards \
                > "tests/harness/out/$cap-$layer.json" || failed="$failed $cap/$layer"
              cat "tests/harness/out/$cap-$layer.json"
              echo "::endgroup::"
            done
          done
          if [ -n "$failed" ]; then
            echo "harness gate failed for:$failed"
            exit 1
          fi

      - name: The plan's verdict of every row (BLOCKING)
        # One line for every row the plan gave out that failed or never ran,
        # with its layer, its shard and, for a row that never ran, why: its
        # shard was cut at its own minutes, ended early, or uploaded nothing.
        # A row that gates fails the step (every X11 row, and a Wayland row of
        # the resize and relayout gates); a row the plan only shows is a
        # warning line the summary counts, so a ncurses row stays judged by the
        # harness reports above and a Wayland row outside its gate files never
        # fails a run for a shared runner's timing alone.
        if: always()
        run: |
          sources=$(ls shards/suite-junit-*.xml 2>/dev/null | paste -sd, -)
          /tmp/ptenv/bin/python tests/harness/suite_plan.py verdict plan/plan.json \
            --status shards --junit "$sources"

      - name: Record the time of each row
        # The next run plans from this record (the newest of the branch that
        # has not expired); a row this run cut, failed, skipped or never
        # reached keeps the time the previous record holds, and so does a whole
        # layer this run passed no row of: the record says, per layer, which
        # host and which wait scale measured it, and the plan reads the shard's
        # own worker count from the file it was made from.  Commit it as
        # tests/harness/suite-timings.json when a commit changes tests/.
        if: always()
        run: |
          sources=$(ls shards/suite-junit-*.xml 2>/dev/null | paste -sd, -)
          previous=plan/record.json
          [ -f "$previous" ] || previous=tests/harness/suite-timings.json
          /tmp/ptenv/bin/python tests/harness/suite_plan.py record "$sources" \
            suite-timings.json --previous "$previous" --collected plan/ids.txt \
            --host-kind runner --scale "$XWPE_TEST_WAIT_SCALE" --settle-ms 400 \
            --plan plan/plan.json --source "run-$GITHUB_RUN_ID"

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-timings
          path: suite-timings.json
          if-no-files-found: ignore

      - name: Upload the gate's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-reports
          path: tests/harness/out/
          if-no-files-found: ignore

      - name: The build ended well (BLOCKING)
        # The gate fails, naming the job, when the build did not succeed: no
        # plan, no tree and no record came out of it, so nothing below it can
        # be read and every row of every layer would be MISSING for want of a
        # plan to be MISSING from.
        #
        # The suite job's own result is deliberately not read here.  One job
        # now holds the shards of all three layers, so its result is one value
        # for all of them, and a Wayland shard that failed for a reason of its
        # own (a package that would not install, a job limit) would fail a run
        # whose gating rows all passed: the layer that must not gate would gate
        # by the back door.  A shard that left nothing is MISSING for every row
        # it held, named with its reason by the two steps above, and each
        # layer's own rule decides whether that fails the run.
        if: always()
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "jobs that did not succeed: build=$BUILD_RESULT"
            exit 1
          fi

  x11-core:
    name: X11 core-font build (no Xft, no Cairo)
    # A build without Xft and Cairo has no back buffer and draws with the
    # core font straight on the window.  The default build never makes that
    # program, so this job builds each such configuration and runs the X11
    # resize and uncover rows on it.  Same workflow as the jobs above, so one
    # dispatch still starts one run.
    runs-on: ubuntu-26.04
    env:
      XDG_CONFIG_HOME: ""
      XDG_STATE_HOME: ""
      XWPE_TEST_WAIT_SCALE: "3"
      # The host tools this job installs (see the top of the file): the X11
      # layer gate stops the session when one of them is missing, where it used
      # to skip the whole layer.
      XWPE_TEST_TOOLS_EXPECTED: >-
        Xvfb xdotool xwd xlogo xwininfo matchbox-window-manager magick xwdtopnm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build + GUI-test dependencies
        # xfonts-base is the core font ("8x13") this build draws with; without
        # it the editor exits at start, and xvfb does not depend on it.  netpbm
        # carries xwdtopnm, which ImageMagick 7 needs to read a screen dump.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake autopoint pkg-config \
            libncurses-dev ncurses-term libx11-dev libxext-dev \
            libfontconfig1-dev libcairo2-dev libpango1.0-dev libfreetype-dev \
            libjson-c-dev zlib1g-dev libssl-dev \
            libwayland-dev wayland-protocols libwayland-bin libxkbcommon-dev \
            xvfb x11-utils x11-xserver-utils xauth xdotool x11-apps netpbm \
            xfonts-base matchbox-window-manager imagemagick \
            python3 python3-pip python3-venv python3-pil

      - name: Build the X11 core-font program
        run: |
          autoreconf -fi
          ./configure --without-xft --without-cairo --without-wayland
          make -j"$(nproc)"
          ./we --version | grep -q 'xft=no cairo=no pango=no'

      - name: Every core-font configuration builds and says what it has
        run: make -s check-build-configs

      - name: Set up the pytest venv and a private XDG_RUNTIME_DIR
        run: |
          sh tests/ci-venv.sh
          mkdir -p /tmp/xdg && chmod 700 /tmp/xdg

      - name: X11 resize and uncover rows on the core-font program
        env:
          XDG_RUNTIME_DIR: /tmp/xdg
        run: >-
          XWPE_BIN="$PWD/xwpe" /tmp/ptenv/bin/python -m pytest -q
          tests/x11/test_resize.py tests/x11/test_expose.py
          tests/x11/test_short_command_repaint.py
          --basetemp "$PWD/x11-core-logs" -rxX

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x11-core-test-logs
          path: x11-core-logs/
          if-no-files-found: ignore
