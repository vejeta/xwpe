# BSD CI for xwpe: FreeBSD, OpenBSD and NetBSD, manual and weekly.
#
# Codeberg/Forgejo has no BSD runners, so the BSDs run on the GitHub
# push-mirror (github.com/vejeta/xwpe), like macOS (macos.yml). Each system is a
# real virtual machine started by a vmactions action on an ubuntu-latest runner:
#     gh workflow run bsd.yml --repo vejeta/xwpe -f os=openbsd
#     gh workflow run bsd.yml --repo vejeta/xwpe -f tests="tests/test_menu_file.py"
# It never runs on push: a run is 30 to 60 minutes of emulated machine.
#
# What it guards: the editor configures and links with the BSD toolchains and
# libraries (the strict-linker and nm-format classes that cost the first BSD
# runs hours), `gmake check` passes except for the failures listed in
# tests/bsd-known-failures.sh, the console-mouse probe and the Xvfb smoke
# (contrib/bsd-test) run, and a small pyte smoke drives the terminal UI.
# The whole pyte suite is NOT run here: it adds 30 to 90 minutes per system.
#
# It is built like the Linux job (--enable-ai --enable-ai-agent-host): with the
# assistant off, test_menus and four check scripts fail on every system for a
# reason that has nothing to do with the BSD.
#
# Action inputs used (checked against memory of each README, not against the
# README itself, so a first run may refuse one):
#   release   the OS version; the action refuses a version it does not know
#   usesh     run the scripts with /bin/sh instead of bash (not installed)
#   envs      names of the environment variables passed into the VM
#   mem, cpu  VM size (freebsd-vm: cpu; openbsd-vm and netbsd-vm: cpu)
#   sync      how the checkout reaches the VM (rsync)
#   copyback  copy files the VM wrote under the workspace back to the runner
#   prepare   one script, run first, as root, with the network (packages)
#   run       the script that sets up as root, then builds and tests as the
#             unprivileged user "tester" (contrib/bsd-test/ci-run.sh)
# The build and test body is one file for the three systems. Only the root
# part (the user, the output folder, the ownership, OpenBSD's ldconfig) is
# repeated in each job, because a workflow cannot share a step between jobs.

name: BSD (manual + weekly)

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Which system to run"
        type: choice
        options: [all, freebsd, openbsd, netbsd]
        default: all
      tests:
        description: >-
          Test ids for the pyte step to run alone, one pass, full tracebacks
          (empty: make check and the small smoke)
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC: all three systems

env:
  # What a build with the assistant must say it has (tests/check-build-config.sh).
  # A library missing from a VM image then fails the job instead of turning a
  # capability into "not built here" and a green run.
  WPE_EXPECT_BUILT: "enable-ai=yes enable-ai-agent-host=yes enable-ai-tls=yes"

jobs:
  freebsd:
    name: FreeBSD 14
    # A scheduled run has no inputs: it runs everything.
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'freebsd'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Test on FreeBSD
        # Packages, build, tests and probes all run inside this one VM step.
        timeout-minutes: 100
        uses: vmactions/freebsd-vm@v1.6.0
        env:
          SELECTED_TESTS: ${{ inputs.tests }}
          WPE_EXPECT_BUILT: ${{ env.WPE_EXPECT_BUILT }}
        with:
          release: "14.3"          # a 14.x release the action lists; pin it
          usesh: true
          mem: 4096
          cpu: 4
          sync: rsync
          copyback: true
          envs: "SELECTED_TESTS WPE_EXPECT_BUILT"
          prepare: |
            uname -a
            pkg install -y autoconf automake libtool gmake pkgconf ncurses \
              libX11 libXft cairo pango libvterm json-c texinfo openssl \
              xorg-vfbserver twm xdpyinfo python3 dejavu \
              py312-pytest py312-pyte py312-wcwidth
            # FreeBSD's default Python is 3.12: the py312- flavours are the ones
            # the package index carries (checked in packagesite, 2026-11-15).
            # freetype2.pc requires bzip2, which the base system does not ship a
            # .pc for: without this stub configure reports "Xft: no".
            if ! pkg-config --exists bzip2 2>/dev/null; then
              printf 'Name: bzip2\nDescription: bzip2\nVersion: 1.0.8\nLibs: -lbz2\n' \
                > /usr/local/libdata/pkgconfig/bzip2.pc
            fi
          run: |
            mkdir -p bsd-out
            # The VM step must end with status 0 so its logs are copied back;
            # every way out records its status for the step after the upload.
            set +e
            trap 'st=$?; cp test-suite.log tests/*.log bsd-out/ 2>/dev/null; echo "$st" > bsd-out/rc; exit 0' EXIT
            # The tests run as an unprivileged user: root ignores file modes.
            pw useradd tester -m -s /bin/sh
            chown -R tester "$PWD"
            su -m tester -c "sh contrib/bsd-test/ci-run.sh freebsd"

      - name: Fail when the run in the VM failed
        if: always()
        run: |
          st=$(cat bsd-out/rc 2>/dev/null || echo "no status: the VM step did not finish")
          echo "status in the VM: $st"
          test "$st" = 0

      - name: Upload logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: bsd-freebsd-logs
          path: |
            bsd-out/
            test-suite.log
            test_*.log
          if-no-files-found: ignore

  openbsd:
    name: OpenBSD 7.7
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'openbsd'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Test on OpenBSD
        timeout-minutes: 100
        uses: vmactions/openbsd-vm@v1.4.9
        env:
          SELECTED_TESTS: ${{ inputs.tests }}
          WPE_EXPECT_BUILT: ${{ env.WPE_EXPECT_BUILT }}
        with:
          release: "7.7"           # or the newest the action lists; older ones are pruned from the mirrors
          usesh: true
          mem: 4096
          cpu: 4
          sync: rsync
          copyback: true
          envs: "SELECTED_TESTS WPE_EXPECT_BUILT"
          prepare: |
            uname -a
            # metaauto wraps autoconf and automake: the versions are named below.
            # OpenBSD has no ncurses package (wide curses is in base) and its
            # TLS is libtls in base, so openssl is not installed.
            pkg_add -I gmake metaauto autoconf%2.72 automake%1.16 pkgconf \
              cairo pango json-c libvterm python%3.12 \
              py3-test py3-pyte py3-wcwidth
            # twm, Xvfb and xdpyinfo are in OpenBSD's base X sets, not packages.
          run: |
            mkdir -p bsd-out
            # The VM step must end with status 0 so its logs are copied back;
            # every way out records its status for the step after the upload.
            set +e
            trap 'st=$?; cp test-suite.log tests/*.log bsd-out/ 2>/dev/null; echo "$st" > bsd-out/rc; exit 0' EXIT
            # The tests run as an unprivileged user: root ignores file modes.
            useradd -m -s /bin/ksh tester
            chown -R tester "$PWD"
            # Needs root, so it is not in ci-run.sh.
            ldconfig /usr/X11R6/lib /usr/local/lib
            su -m tester -c "sh contrib/bsd-test/ci-run.sh openbsd"

      - name: Fail when the run in the VM failed
        if: always()
        run: |
          st=$(cat bsd-out/rc 2>/dev/null || echo "no status: the VM step did not finish")
          echo "status in the VM: $st"
          test "$st" = 0

      - name: Upload logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: bsd-openbsd-logs
          path: |
            bsd-out/
            test-suite.log
            test_*.log
          if-no-files-found: ignore

  netbsd:
    name: NetBSD 10
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'netbsd'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Test on NetBSD
        timeout-minutes: 100
        uses: vmactions/netbsd-vm@v1.5.3
        env:
          SELECTED_TESTS: ${{ inputs.tests }}
          WPE_EXPECT_BUILT: ${{ env.WPE_EXPECT_BUILT }}
        with:
          release: "10.1"          # NetBSD 9.x package repositories are pruned: 10.x only
          usesh: true
          mem: 4096
          cpu: 4
          sync: rsync
          copyback: true
          envs: "SELECTED_TESTS WPE_EXPECT_BUILT"
          prepare: |
            uname -a
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH
            # The image has pkg_add but not pkgin (the action's own README
            # installs with /usr/sbin/pkg_add); pkgin comes first from it.
            command -v pkgin >/dev/null 2>&1 || /usr/sbin/pkg_add pkgin
            pkgin -y update
            pkgin -y install gmake autoconf automake pkgconf cairo pango json-c \
              ncurses openssl python313 py313-test py313-pyte py313-wcwidth \
              libvterm03
            # libvterm03 is libvterm 0.3, the version the other systems build with
            # (both libvterm01 and libvterm03 are in the 10.0_2026Q3 index).
          run: |
            mkdir -p bsd-out
            # The VM step must end with status 0 so its logs are copied back;
            # every way out records its status for the step after the upload.
            set +e
            trap 'st=$?; cp test-suite.log tests/*.log bsd-out/ 2>/dev/null; echo "$st" > bsd-out/rc; exit 0' EXIT
            # The tests run as an unprivileged user: root ignores file modes.
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH
            useradd -m -s /bin/sh tester
            chown -R tester "$PWD"
            su -m tester -c "sh contrib/bsd-test/ci-run.sh netbsd"

      - name: Fail when the run in the VM failed
        if: always()
        run: |
          st=$(cat bsd-out/rc 2>/dev/null || echo "no status: the VM step did not finish")
          echo "status in the VM: $st"
          test "$st" = 0

      - name: Upload logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: bsd-netbsd-logs
          path: |
            bsd-out/
            test-suite.log
            test_*.log
          if-no-files-found: ignore
