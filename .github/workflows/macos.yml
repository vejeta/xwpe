# Manual macOS CI for xwpe.
#
# Codeberg/Forgejo has no macOS runners, so macOS coverage runs on the GitHub
# push-mirror (github.com/vejeta/xwpe) using GitHub's free macOS runners. It is
# "workflow_dispatch" ONLY -- it never runs on push; you launch it on demand
# from the Actions tab ("Run workflow") or with:
#     gh workflow run macos.yml --repo vejeta/xwpe
#
# It runs on BOTH architectures, because they are genuinely different targets:
#   - macos-15       : Apple Silicon (arm64)
#   - macos-15-intel : Intel (x86_64)   <- the arch Homebrew bottles as "*-x86_64"
# (macos-13 was retired in December 2025 and macos-14 in November 2026; a
# job on a retired image is refused or waits forever without a runner.)
# Skipping Intel here is what let an x86_64-only regression reach Homebrew-core
# unseen, so both are first-class in the matrix now.
#
# What it guards: the console build links and runs on each arch; the
# macOS-specific console-mouse behaviour (arrow-cursor / drag-spin fixes) keeps
# working; and -- mirroring the Homebrew formula's own `test do` block -- that
# `wpe` drives a real pseudo-terminal, initialises ncurses, and paints an opened
# file's contents on screen. X11 (XQuartz) is out of scope here; it is
# heavy/flaky in CI and covered by the Homebrew tap.

name: macOS (manual)

on:
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          Test ids for the UI step to run alone, one pass, full tracebacks
          (empty: the whole suite)
        required: false
        default: ""

jobs:
  macos:
    name: macOS console (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (arm64)
          - runner: macos-15-intel   # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # The runner ships extra prebuilt taps (aws/tap, azure/bicep) we never use;
      # silence the upcoming tap-trust warning instead of chasing them.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Show arch
        run: |
          uname -m
          sw_vers || true

      - name: Install deps
        run: brew install autoconf automake pkgconf ncurses json-c libvterm texinfo openssl@3

      - name: Build (--enable-ai --enable-ai-agent-host --without-x)
        # The same build the Linux job tests: the assistant and its agent host
        # are compiled in, so the rows that drive them run here instead of
        # skipping.  ncurses and openssl@3 are keg-only on macOS: both
        # pkg-config directories are named, joined with ":", or configure
        # finds neither (a missing openssl would build without TLS and only
        # warn; WPE_EXPECT_BUILT below makes that fail by name).
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig"
          autoreconf -fi
          ./configure --enable-ai --enable-ai-agent-host --without-x --without-gpm
          make -j"$(sysctl -n hw.ncpu)"
          ./we --version

      - name: Build every check program (names each that does not compile)
        timeout-minutes: 15
        run: make -k check TESTS= 2>&1 | tee check-programs.log || true

      - name: make check (the editor's own tests)
        # Every step past the build has its own time limit: a step that hangs
        # must fail by itself, so the later steps and the log upload still run.
        # A job stopped by the 6-hour limit keeps no logs at all.
        #
        # The tests of the owner of children and of waiting (the fd loop, the
        # child owner, the DAP transport, the BSP and LSP request layers) need
        # no toolchain, so they run here alone and first: a hang in one of them
        # fails inside this step, named, and the toolchain tests below still run.
        # Each test runs under tests/with-deadline.sh (TERM, then KILL, after 600 s,
        # a TIMEOUT line in its log), and the C tests carry their own watchdog
        # (tests/test_watchdog.h) that names the case that hung.  VERBOSE=yes
        # makes automake print the log of every failed test into this step's log.
        timeout-minutes: 15
        env:
          VERBOSE: "yes"
          # Stretch every wait by 3x, as the pyte suite below and the Debian
          # autopkgtest do, instead of weakening the assertions.
          XWPE_TEST_WAIT_SCALE: "3"
          # What this job configured.  A library the runner image loses (here
          # openssl) fails tests/check-build-config.sh by name, instead of
          # turning a capability into "not built here" and a green run.  This
          # is also the first run of that script under the BSD sed and grep.
          WPE_EXPECT_BUILT: >-
            enable-ai=yes enable-ai-agent-host=yes enable-ai-tls=yes
            with-x=no with-wayland=no with-gpm=no
        run: >-
          make check
          LOG_COMPILER="$PWD/tests/with-deadline.sh 600"
          TESTS="tests/check-build-config.sh test_watchdog tests/check-with-deadline.sh test_checkheader
          test_syntax_def test_fdloop test_child test_childsig test_dap
          test_bsp_close test_lsp_requests test_startplan test_clipboard
          test_lsp_buffer test_lsp_doctor test_lsp_semantic test_lsp_truecolor
          test_fileop test_childfds test_childfds_loop"
          || { cat test-suite.log; exit 1; }

      - name: make check (the tests that need a toolchain)
        # LSP/DAP server tests SKIP when their server is absent. But GitHub's
        # macOS runner ships rust-analyzer + cargo, so test_lsp_rust runs instead
        # of skipping, and its cold start (indexing std + cargo-check) exceeds the
        # test's wait budget on a fresh runner -- a flaky timeout, not an xwpe
        # fault. The Rust LSP path is covered by the Linux CI, so exclude just
        # that one test here (everything else passes or skips cleanly).
        # Runs even when the step above failed, so one run reports both.
        if: always()
        timeout-minutes: 30
        env:
          VERBOSE: "yes"
          XWPE_TEST_WAIT_SCALE: "3"
        run: >-
          make check
          LOG_COMPILER="$PWD/tests/with-deadline.sh 600"
          TESTS="test_dap_dlv test_dap_gdb test_dap_lldb test_dap_scala
          test_lsp_scala test_lsp_clangd test_lsp_python test_lsp_gopls"
          || { cat test-suite.log; exit 1; }

      - name: pyte UI regression suite (keystrokes, menus, editing, rendering)
        # The terminal files of this suite, without the assistant's files and
        # the compile and debugger files: those run in the `assistant` job
        # below, with their own time limit, so that neither half can stop the
        # other at the job's six-hour limit.  The two halves are one workflow
        # run.
        timeout-minutes: 300
        # The terminal UI is what users actually touch, and "simple" key/render
        # regressions -- like Backspace not erasing on macOS terminals, which send
        # DEL (0x7f) rather than BS -- slip straight past a C-only `make check`.
        # Drive the real ncurses UI through a pseudo-terminal with pyte and assert
        # on the screen and the file written to disk.  No row is dropped by name
        # here: a row that needs a language server, a debugger adapter or a
        # runtime the runners are too slow for declares the tool it needs, and
        # XWPE_TEST_TOOLS_OFF below switches those tools off, so the row skips
        # naming the tool.  The Linux CI exercises them.
        env:
          # The tools this job does not exercise (tests/host_tools.py).  Each
          # row that needs one skips as "<tool>: not exercised by this job".
          XWPE_TEST_TOOLS_OFF: >-
            clangd gopls rust-analyzer cargo rustc lldb-dap pyright-langserver
            pylsp scala-cli scalac scala metals dlv a68g ga68 gdb
          # GitHub's macOS runners are markedly slower than the Linux ones (the
          # suite takes ~10x longer here), so the per-scenario wait budgets that
          # pass in-tree flake at the default scale. Stretch every wait by 3x,
          # exactly as the Debian autopkgtest does, instead of weakening the
          # assertions.
          XWPE_TEST_WAIT_SCALE: "3"
          # A key's wait ends once the editor has painted and been quiet for
          # this many ms, instead of always costing the full budget (as in
          # linux.yml).
          XWPE_TEST_SETTLE_MS: "400"
          # A login-shell TERM the macOS-smoke sanity check expects (CI shells
          # have none); the editor under test always gets its own TERM regardless.
          TERM: "xterm-256color"
          SELECTED_TESTS: ${{ inputs.tests }}
        run: |
          python3 -m venv /tmp/ptenv
          /tmp/ptenv/bin/pip install --quiet pyte==0.8.1 pytest pytest-rerunfailures pytest-xdist
          # Load the in-app help from the checkout (the editor's "_eng" fallback)
          # so the Help/manual scenarios pass without a `make install`.
          export XWPE_LIB="$PWD"
          # Every editor the rows start appends its keystroke trace here; the
          # file is uploaded with the logs, so a row that fails reads what
          # the editor received.  One file per run and attempt.
          export XWPE_UI_TRACE="$RUNNER_TEMP/ui-trace-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          # The harness writes the bytes of every key into a pseudo-terminal;
          # no macOS keyboard layer sits between it and the editor, so every
          # function key is sent as on Linux.
          # Ignore tests/x11 AND tests/wayland: both need a Linux display stack
          # (Xvfb+matchbox / weston) absent on macOS, and they share test-module
          # basenames with tests/ -- collecting them here is an import-file-mismatch
          # error, not a real failure.
          # Say what this job switched off, so the log of a run that stopped
          # exercising a tool says so.
          echo "XWPE_TEST_TOOLS_OFF=$XWPE_TEST_TOOLS_OFF"
          # Asked for chosen test ids: run only those, one at a time, once,
          # with every traceback, and print the facts of this system the
          # rows depend on, so a macOS-only failure can be read in one run.
          if [ -n "$SELECTED_TESTS" ]; then
            # The ids hold [param] parts: split on blanks, never glob.
            set -f
            # Chosen ids run with every tool on: an id that needs gdb runs.
            unset XWPE_TEST_TOOLS_OFF
            getconf PATH_MAX / ; getconf NAME_MAX /
            infocmp -1 xterm-256color | grep -E 'acsc|rmcup|rmkx|cnorm|sgr0' || true
            cc --version | head -1
            WPE_BIN="$PWD/wpe" /tmp/ptenv/bin/python -m pytest -v --tb=long -p no:cacheprovider $SELECTED_TESTS
            exit $?
          fi
          # -v names each test as it ends, so a step that runs out of time
          # still says which rows failed; one rerun keeps a flake from
          # costing three runs of a row that really fails.
          # The live rows (never part of a gate) are the only rows left out by name.
          WPE_BIN="$PWD/wpe" /tmp/ptenv/bin/python -m pytest -v tests -n 3 --reruns 1 --reruns-delay 3 -rf \
            --ignore=tests/x11 --ignore=tests/wayland \
            --ignore-glob='tests/test_ai_*.py' \
            --ignore=tests/test_debugger_integration.py --ignore=tests/test_compile_and_messages.py \
            --ignore=tests/test_compile.py --ignore=tests/test_run_kind.py \
            --ignore=tests/test_program_name.py --ignore=tests/test_build_cwd.py \
            --ignore=tests/test_path_debugger.py --ignore=tests/test_debugger_ends.py \
            --ignore=tests/test_debugger_watchdog.py --ignore=tests/test_make_output.py \
            --ignore=tests/test_user_screen.py \
            -k "not _live"

      - name: Homebrew test-block reproduction (installed binary, on-disk A/B/C)
        if: always()   # validate the formula fix even if a pyte UI test flaked
        timeout-minutes: 20
        # Faithful mirror of Formula/x/xwpe.rb `test do`: build + install to a
        # prefix and drive the INSTALLED wpe (no XWPE_LIB, exactly as `brew test`
        # does) through the three on-disk assertions -- edit+save lands the typed
        # text, a read-only (0444) file is left unchanged, a directory opens the
        # file manager and quits cleanly. On-disk ground truth, so it does NOT
        # depend on scraping the rendered screen (the x86_64 "0 bytes" capture
        # trap). A failure here is a failure Homebrew-core would hit.
        env:
          # A fresh HOME has no profile, so a first start asks which keys to
          # use and the typed keys would answer that box. XWPE_KEYS skips it.
          XWPE_KEYS: borland
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig"
          ./configure --prefix=/tmp/xp --without-x --without-gpm >/tmp/cf3.log 2>&1
          make -j"$(sysctl -n hw.ncpu)" >/tmp/mk3.log 2>&1
          make install >/tmp/inst3.log 2>&1
          cat > /tmp/brew_abc.rb <<'RUBY'
          require "pty"
          require "io/console"
          require "tmpdir"
          require "timeout"
          ENV["TERM"] = "xterm-256color"
          BIN = "/tmp/xp/bin/wpe"
          # One run of the editor may take 60 s at most; a stuck editor then
          # fails here with what it painted, not at the 20 minute step limit.
          RUN_LIMIT = 60
          drive = lambda do |arg, keys|
            status = nil
            seen = +""
            PTY.spawn(BIN, arg.to_s) do |r, w, pid|
              r.winsize = [24, 80]
              settle = lambda do |floor, cap|
                sleep floor
                deadline = Time.now + cap
                last = Time.now
                while Time.now < deadline
                  ready, = IO.select([r], nil, nil, 0.2)
                  if ready
                    begin
                      seen << r.read_nonblock(4096); last = Time.now
                    rescue IO::WaitReadable
                      nil
                    rescue Errno::EIO, EOFError
                      break
                    end
                  elsif Time.now - last > 0.5
                    break
                  end
                end
              end
              begin
                Timeout.timeout(RUN_LIMIT) do
                  settle.call(4, 12)                       # wait for first paint
                  keys.each { |k| w.write k; settle.call(2, 6) }
                  w.write "\ex"
                  sleep 1
                end
              rescue Errno::EIO
                nil
              rescue Timeout::Error
                puts "STUCK after #{RUN_LIMIT}s on #{arg}; painted #{seen.bytesize} bytes, tail:"
                puts seen[-600..-1].inspect
                raise "editor stuck on #{arg}"
              ensure
                begin
                  Process.kill "TERM", pid
                rescue Errno::ESRCH
                  nil
                end
                status = (Timeout.timeout(10) { Process.wait2(pid)[1] } rescue nil)
              end
            end
            status
          end
          Dir.mktmpdir do |d|
            ed = "#{d}/edit.c"; File.write(ed, ""); m = "xwpe_brew_marker"
            drive.call(ed, [m, "\ef", "s"])
            raise "A edit+save FAILED: #{File.read(ed).inspect}" unless File.read(ed).include?(m)
            ro = "#{d}/ro.c"; File.write(ro, "ORIGINAL\n"); File.chmod(0o444, ro)
            drive.call(ro, ["INJECTED", "\ef", "s"])
            raise "B read-only MODIFIED: #{File.read(ro).inspect}" unless File.read(ro) == "ORIGINAL\n"
            st = drive.call(d, [])
            raise "C directory NOT clean: #{st.inspect}" unless st.nil? || st.success? || st.termsig == 15
            puts "A/B/C all pass on the installed binary"
          end
          RUBY
          ruby /tmp/brew_abc.rb

      - name: Diagnose the INSTALLED binary (true Homebrew condition)
        if: always()
        timeout-minutes: 15
        env:
          XWPE_KEYS: borland   # no first-run keys question in a fresh HOME
        # The step above runs ./wpe from the BUILD TREE with XWPE_LIB=$PWD, which
        # is NOT what `brew test` does: Homebrew runs the INSTALLED wpe with no
        # XWPE_LIB. If the installed binary cannot find its data (terminfo, help,
        # syntax) it can die before painting -> 0 bytes, exactly the homebrew-core
        # failure. Reproduce faithfully: configure with a real --prefix, install
        # there, then drive the installed wpe with NO XWPE_LIB, dumping everything.
        run: |
          set +e   # diagnostic step: gather everything; never fail the job on a sub-command
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig"
          ./configure --prefix=/tmp/xp --without-x --without-gpm >/tmp/cf2.log 2>&1
          make -j"$(sysctl -n hw.ncpu)" >/tmp/mk2.log 2>&1
          make install >/tmp/inst.log 2>&1 || { echo "INSTALL FAILED"; tail -20 /tmp/inst.log; }
          echo "=== installed tree ==="; ls -l /tmp/xp/bin/ ; echo "--- share ---"; ls -R /tmp/xp/share 2>/dev/null | head -20; echo "--- lib/xwpe ---"; ls /tmp/xp/lib/xwpe 2>/dev/null
          echo "=== otool -L installed we (dylib resolution) ==="; otool -L /tmp/xp/bin/we 2>/dev/null
          echo "=== terminfo xterm-256color present? ==="; infocmp xterm-256color >/dev/null 2>&1 && echo FOUND || echo MISSING
          echo "=== run INSTALLED wpe under a pty, NO XWPE_LIB, capture all + timing ==="
          cat > /tmp/probe.rb <<'RUBY'
          require "pty"; require "io/console"; require "timeout"
          ENV["TERM"] = "xterm-256color"
          File.write("/tmp/h.c", "// XWPE_BREW_TEST_MARKER\nint main(void){return 0;}\n")
          o = +""; k = nil; t = Time.now
          PTY.spawn("/tmp/xp/bin/wpe", "/tmp/h.c") do |r, _w, pid|
            r.winsize = [24, 80]
            begin
              Timeout.timeout(12) do
                loop do
                  begin; o << r.readpartial(4096); rescue Errno::EIO, EOFError; break; end
                  break if o.include?("XWPE_BREW_TEST_MARKER")
                end
              end
            rescue => e; k = e.class
            ensure; (Process.kill("TERM", pid) rescue nil)
            end
          end
          puts "INSTALLED: elapsed=#{(Time.now - t).round(1)}s bytes=#{o.bytesize} exc=#{k} esc=#{o.match?(/\e\[/)} marker=#{o.include?('XWPE_BREW_TEST_MARKER')}"
          puts "head=#{o[0, 220].inspect}"
          RUBY
          ruby /tmp/probe.rb
          echo "=== installed wpe with stdin/out as PIPES (surface any stderr it prints) ==="
          /tmp/xp/bin/wpe /tmp/h.c </dev/null >/tmp/wo.txt 2>/tmp/we.txt & p=$!; sleep 3; kill "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true
          echo "stdout bytes: $(wc -c </tmp/wo.txt) ; stderr:"; cat /tmp/we.txt | head -20
          true   # diagnostic step: never let the killed-child exit status fail the job

      - name: Diagnostic - old read_nonblock poll (expected to be flaky on Intel)
        if: always()   # evidence step: run regardless of earlier outcomes
        # Kept as evidence only: this is the loop the first Homebrew submission
        # shipped. On EOF read_nonblock(exception: false) returns nil, which is
        # not a String, so the loop sleeps and retries instead of stopping -- a
        # fast-exiting or fast-EOF child leaves output empty until the 30s
        # timeout. continue-on-error: it documents the bug, it does not gate CI.
        continue-on-error: true
        timeout-minutes: 5
        env:
          XWPE_KEYS: borland   # no first-run keys question in a fresh HOME
        run: |
          cat > /tmp/brew_test_old.rb <<'RUBY'
          require "pty"
          require "io/console"
          require "timeout"
          require "tmpdir"

          marker = "XWPE_BREW_TEST_MARKER"
          Dir.mktmpdir do |dir|
            path = File.join(dir, "hello.c")
            File.write(path, "// #{marker}\nint main(void) { return 0; }\n")
            ENV["TERM"] = "xterm-256color"

            output = +""
            PTY.spawn("./wpe", path) do |r, w, pid|
              r.winsize = [24, 80]
              begin
                Timeout.timeout(30) do
                  loop do
                    chunk = r.read_nonblock(4096, exception: false)
                    if chunk.is_a?(String)
                      output << chunk
                      break if output.include?(marker)
                    else
                      sleep 0.1
                    end
                  end
                end
                w.write "\ex"
              rescue Timeout::Error, Errno::EIO
                nil
              ensure
                begin
                  Process.kill("TERM", pid)
                rescue Errno::ESRCH
                  nil
                end
              end
            end

            puts "captured #{output.bytesize} bytes; ESC[=#{output.match?(/\e\[/)} marker=#{output.include?(marker)}"
            raise "OLD-LOGIC FAILED (empty/short capture)" unless output.match?(/\e\[/) && output.include?(marker)
            puts "old-logic OK"
          end
          RUBY
          ruby /tmp/brew_test_old.rb

      - name: Console mouse probe
        if: always()    # the macOS-specific guard: run it even if a test above failed
        timeout-minutes: 5
        # macOS keeps openpty() in libc, so no -lutil (unlike the BSDs/glibc).
        run: |
          cc -O2 -o /tmp/probe contrib/bsd-test/sgr_mouse_probe.c
          /tmp/probe ./we xterm-256color

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.runner }}
          # test-suite.log is the automake summary; test_*.log are the per-test
          # logs (a hung test leaves its watchdog or TIMEOUT line in its own).
          path: |
            test-suite.log
            test_*.log
            *.log
            tests/*.log
            ${{ runner.temp }}/ui-trace-${{ github.run_id }}-${{ github.run_attempt }}.log
          if-no-files-found: ignore

  assistant:
    # The assistant's terminal files and the compile and debugger files, on
    # their own runner and time limit, in the same workflow run as the job
    # above (one run at a time).  They were left out of the macOS suite while
    # the build had no assistant and rows were dropped by name; now the build
    # has it, and these rows run.  Measure before adding more here: a job
    # stopped by the six-hour limit keeps no logs.
    name: macOS assistant and compile rows (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (arm64)
          - runner: macos-15-intel   # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: brew install autoconf automake pkgconf ncurses json-c libvterm texinfo openssl@3

      - name: Build (--enable-ai --enable-ai-agent-host --without-x)
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig"
          autoreconf -fi
          ./configure --enable-ai --enable-ai-agent-host --without-x --without-gpm
          make -j"$(sysctl -n hw.ncpu)"
          ./we --version

      - name: pyte UI suite, assistant and compile rows
        # Its own limit, so a slow half cannot take the other's logs with it.
        # Without the `tests` input only this job's files run; with it, the
        # chosen ids run in the job above and this step has nothing to do.
        timeout-minutes: 300
        env:
          # The tools this job does not exercise: the same list as the job
          # above, printed below.
          XWPE_TEST_TOOLS_OFF: >-
            clangd gopls rust-analyzer cargo rustc lldb-dap pyright-langserver
            pylsp scala-cli scalac scala metals dlv a68g ga68 gdb
          XWPE_TEST_WAIT_SCALE: "3"
          XWPE_TEST_SETTLE_MS: "400"
          TERM: "xterm-256color"
          SELECTED_TESTS: ${{ inputs.tests }}
        run: |
          if [ -n "$SELECTED_TESTS" ]; then
            echo "chosen ids run in the macOS console job"
            exit 0
          fi
          python3 -m venv /tmp/ptenv
          /tmp/ptenv/bin/pip install --quiet pyte==0.8.1 pytest pytest-rerunfailures pytest-xdist
          export XWPE_LIB="$PWD"
          export XWPE_UI_TRACE="$RUNNER_TEMP/ui-trace-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          echo "XWPE_TEST_TOOLS_OFF=$XWPE_TEST_TOOLS_OFF"
          # The live rows (never part of a gate) are the only rows left out by name.
          WPE_BIN="$PWD/wpe" /tmp/ptenv/bin/python -m pytest -v -n 3 --reruns 1 --reruns-delay 3 -rf \
            tests/test_ai_*.py \
            tests/test_debugger_integration.py tests/test_compile_and_messages.py \
            tests/test_compile.py tests/test_run_kind.py \
            tests/test_program_name.py tests/test_build_cwd.py \
            tests/test_path_debugger.py tests/test_debugger_ends.py \
            tests/test_debugger_watchdog.py tests/test_make_output.py \
            tests/test_user_screen.py \
            -k "not _live"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assistant-logs-${{ matrix.runner }}
          path: |
            test-suite.log
            *.log
            tests/*.log
            ${{ runner.temp }}/ui-trace-${{ github.run_id }}-${{ github.run_attempt }}.log
          if-no-files-found: ignore
